version: '3.8'

services:
  db:
    image: postgres:16
    container_name: triage-db
    restart: always
    environment:
      POSTGRES_USER: triage_user
      POSTGRES_PASSWORD: triage_pass
      POSTGRES_DB: triage_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: